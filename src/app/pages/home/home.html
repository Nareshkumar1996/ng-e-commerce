<div class="home-page">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      E-Commerce
    </div>

    <div class="header-actions">
      <button class="btn btn-login">Login</button>
      <button class="btn btn-register">Register</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="hero-section">

    <div class="hero-content">
      <h1>Welcome to Our E-Commerce Store</h1>

      <p>
        Discover amazing products at great prices.
        Shop your favorite products from the comfort of your home.
      </p>

      <div class="hero-buttons">
        <button class="btn btn-login" (click)="goToLogin()">Login</button>
        <button class="btn btn-register" (click)="goToRegister()">Register</button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 E-Commerce. All rights reserved.</p>
  </footer>

</div>
